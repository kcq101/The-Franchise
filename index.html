<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Franchise</title>
<style>
/* base reset the game expects */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: the stage is the whole screen in landscape, with the two foot pads floating in the bottom corners under the thumbs. Portrait stacks stage over pads. */
:root{
  color-scheme: dark;
  --night:#06081a;
  --panel:#12152b;
  --edge:#3a4070;
  --ink:#eeeadb;
  --dim:#9a9dbd;
  --gold:#f6b93a;
  --red:#e2362c;
  --lamp:#ffd27a;
  --glass-rim:rgba(255,255,255,.4);
  --glass-hi:rgba(255,255,255,.5);
  --glass-mid:rgba(190,200,255,.14);
  --glass-lo:rgba(24,30,78,.36);
  --glass-edge:rgba(4,6,22,.6);
  --pad-ink:#06081a;
  --display:"Press Start 2P", "Courier New", monospace;
  --text:"VT323", "Courier New", monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cab{position:relative;height:100%;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;padding-inline:16px;padding-block:12px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;container-type:size;flex:none;outline:3px solid var(--edge)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;font-size:4.6cqh;line-height:1.35;text-shadow:.12em .12em 0 #000}
.who{position:absolute;left:1.6cqw;top:3cqh;display:flex;gap:1.2cqw;align-items:flex-start}
.who img{height:13cqh;width:auto;image-rendering:pixelated;display:block}
.who .name{color:var(--gold)}
.meter{display:flex;gap:.35cqh;margin-top:1.2cqh;padding:.5cqh;background:#0b0c18;border:.5cqh solid #c9cbd8;width:max-content}
.meter i{display:block;width:3.2cqh;height:3cqh;background:#3a1014}
.meter i.on{background:var(--red);box-shadow:inset 0 .7cqh 0 #ff7a66}
.who .sub{font-size:2.6cqh;color:var(--dim);margin-top:.8cqh}
.score{position:absolute;right:1.6cqw;top:3cqh;text-align:right}
.score .s{color:var(--gold)}
.score b{font-weight:400;color:#fff;font-variant-numeric:tabular-nums}
.score .lv{color:var(--dim);font-size:3.6cqh;line-height:1.5}
#snd{pointer-events:auto;font:inherit;font-size:max(7px,2.8cqh);color:var(--dim);background:rgba(6,8,26,.55);border:.4cqh solid var(--edge);padding:1cqh 1.2cqw;margin-top:1cqh;cursor:pointer}
#snd:focus-visible{outline:2px solid var(--lamp)}
#track{position:absolute;left:0;top:0;height:1.4cqh;width:0;background:var(--gold)}
#hint{position:absolute;left:0;right:0;bottom:5cqh;text-align:center;font-size:4.6cqh;white-space:pre-line;line-height:1.7;text-shadow:.15em .15em 0 #000;animation:blink 1s steps(2) infinite;pointer-events:none}
@keyframes blink{50%{opacity:.2}}

#tug{position:absolute;left:50%;top:5cqh;transform:translateX(-50%);display:flex;align-items:center;gap:1.2cqw;font-size:3.2cqh;text-shadow:.12em .12em 0 #000;pointer-events:none}
#tug span:first-child{color:var(--gold)}
#tug .t{position:relative;width:30cqw;height:4.4cqh;border:.6cqh solid #c9cbd8;background:var(--red);overflow:hidden}
#tug .t i{position:absolute;inset:0 auto 0 0;width:50%;background:var(--gold)}
#tug .t::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.5cqh;margin-left:-.25cqh;background:#0b0c18}

/* title */
#title{-webkit-tap-highlight-color:transparent;position:absolute;inset:0;background:#070a1e;cursor:pointer;overflow:hidden;border:0;padding:0;width:100%;height:100%;display:block}
#title .bg{position:absolute;inset:-8%;width:116%;height:116%;max-width:none;object-fit:cover;filter:blur(18px) brightness(.55)}
#title .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#titlehint{z-index:2}
#title #titlehint{position:absolute;left:0;right:0;bottom:4cqh;text-align:center;font-family:var(--display);font-size:4.4cqh;color:#fff;text-shadow:.15em .15em 0 #000;animation:blink 1s steps(2) infinite}
#title:focus-visible,.pad:focus-visible,#again:focus-visible{outline:3px solid var(--lamp);outline-offset:-3px}

/* ending */
#end{position:absolute;left:24cqw;right:24cqw;top:4cqh;background:var(--panel);border:.8cqh solid var(--ink);padding:3cqh 2cqw;display:flex;flex-direction:column;gap:2.4cqh}
#end p{margin:0;font-family:var(--text);font-size:max(14px,5.6cqh);line-height:1.05;text-wrap:balance}
#end .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#end .stat{font-size:max(7px,3.4cqh);color:var(--lamp);line-height:1.6}
#again{font:inherit;font-size:max(8px,3.6cqh);background:var(--gold);color:var(--pad-ink);border:0;padding:2.2cqh 1.6cqw;cursor:pointer}

/* pads */
.pads{flex:1;display:grid;grid-template-columns:1fr 1fr;place-items:center;min-height:120px;max-height:220px}
.pad{-webkit-tap-highlight-color:transparent;outline:none;--d:clamp(84px,26vw,112px);width:var(--d);height:var(--d);border-radius:50%;padding:0;cursor:pointer;touch-action:none;
  font-family:var(--display);color:var(--ink);display:flex;align-items:center;justify-content:center;
  border:2px solid var(--glass-rim);
  background:radial-gradient(circle at 34% 26%,var(--glass-hi),var(--glass-mid) 36%,var(--glass-lo) 72%,var(--glass-edge));
  box-shadow:inset 0 -7px 12px rgba(0,0,0,.5),inset 0 3px 5px rgba(255,255,255,.28),0 5px 0 rgba(0,0,0,.4),0 10px 16px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:transform .05s}
.pad b{font-size:calc(var(--d) * .3);font-weight:400;text-shadow:0 2px 0 rgba(0,0,0,.6);transform:translateY(-2px)}
.pad span{display:none}
.pad.next{border-color:var(--lamp);box-shadow:inset 0 -7px 12px rgba(0,0,0,.5),inset 0 3px 5px rgba(255,255,255,.28),0 5px 0 rgba(0,0,0,.4),0 10px 16px rgba(0,0,0,.45),0 0 16px rgba(255,210,122,.65)}
.pad.next b{color:var(--lamp)}
.pad.down{transform:translateY(5px) scale(.96);border-color:var(--lamp);
  background:radial-gradient(circle at 40% 34%,rgba(255,236,190,.75),rgba(255,200,110,.5) 45%,rgba(160,100,30,.5));
  box-shadow:inset 0 5px 12px rgba(0,0,0,.55),0 1px 0 rgba(0,0,0,.4)}
.pad.down b{color:var(--pad-ink);text-shadow:none}
.pad.miss{border-color:var(--red)}
.pad:disabled{opacity:.3;cursor:default}
.turn{font-size:8px;line-height:1.7;color:var(--dim);text-align:center;margin:0}

@media (orientation:landscape){
  .cab{padding:0;gap:0;align-items:center;justify-content:center}
  .stage{aspect-ratio:auto;height:100%;max-width:calc(100vh * 2.9);outline:0}
  .pads{position:absolute;inset:auto 0 0 0;display:block;min-height:0;max-height:none;pointer-events:none;flex:none}
  .pad{--d:clamp(58px,22vh,92px);position:absolute;bottom:max(16px, env(safe-area-inset-bottom, 0px));pointer-events:auto}
  #padL{left:max(20px, env(safe-area-inset-left, 0px))}
  #padR{right:max(20px, env(safe-area-inset-right, 0px))}
  .turn{display:none}
}
@media (prefers-reduced-motion:reduce){#hint,#title span{animation:none}}
</style>
</head>
<body>

<div class="cab">
  <div class="stage" id="stage">
    <canvas id="c" width="468" height="216"></canvas>
    <div class="hud" id="hud">
      <div id="track"></div>
      <div class="who">
        <img src="portrait.png" alt="Frank">
        <div>
          <div class="name">FRANK</div>
          <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sub" id="barlab">SPEED</div>
        </div>
      </div>
      <div class="score"><span class="s">SCORE</span> <b id="score">000000</b><div class="lv" id="lvl">RUSHVILLE<br>LEVEL 1-1</div><button id="snd" type="button">SOUND ON</button></div>
    </div>
    <div id="tug" hidden><span>FRANK</span><div class="t"><i id="tugfill"></i></div><span>THIEF</span></div>
    <div id="hint" hidden></div>
    <div id="end" hidden>
      <p id="endtext"></p>
      <div class="row"><span class="stat" id="stat"></span><button id="again" type="button">PLAY AGAIN</button></div>
    </div>
    <button id="title" type="button" aria-label="Start game">
      <img class="bg" src="title2.webp" alt="">
      <img class="art" src="title2.webp" alt="The Franchise">
      <span id="titlehint">TAP TO START</span>
    </button>
  </div>
  <p class="turn">TURN YOUR PHONE SIDEWAYS FOR THE WIDE VIEW</p>
  <div class="pads">
    <button class="pad next" id="padL" type="button"><b>L</b><span>LEFT FOOT</span></button>
    <button class="pad next" id="padR" type="button"><b>R</b><span>RIGHT FOOT</span></button>
  </div>
</div>

<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),stage=document.getElementById('stage');
var W=468,H=216,BASE=160,CURB=168,ROAD=172,FEET=190,TAU=Math.PI*2;
var START=110,RUN=3600,END=START+RUN,END2=END+1800;
var padL=document.getElementById('padL'),padR=document.getElementById('padR');
var hint=document.getElementById('hint'),endBox=document.getElementById('end'),titleEl=document.getElementById('title');
var scoreEl=document.getElementById('score'),track=document.getElementById('track'),stat=document.getElementById('stat');
var segs=document.getElementById('meter').children;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function fit(){var r=stage.getBoundingClientRect();if(!r.height)return;W=Math.max(288,Math.min(620,Math.round(H*r.width/r.height)));cv.width=W*2;cv.height=H*2;g.imageSmoothingEnabled=false}
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);window.addEventListener('resize',fit);fit();

/* ================= scenery art ================= */
var fenceP=(function(){var c=mk(6,6),x=c.getContext('2d');x.fillStyle='rgba(150,158,190,.5)';for(var i=0;i<6;i++){x.fillRect(i,i,1,1);x.fillRect(i,5-i,1,1)}return g.createPattern(c,'repeat')})();
function ok(i){return i.complete&&i.naturalWidth}
var skyImg=load('sky.webp'),streetImg=load('street.webp');
var SEC=[null,{w:690,h:345},{w:601,h:336},{w:759,h:340},{w:728,h:338},{w:807,h:325}];
for(var si=1;si<6;si++)SEC[si].img=load('sec'+si+'.webp');
var wall=[],props=[],lamps=[],SIGNX=198;
function layout(){var x=-30;
  function sec(n,f){wall.push({s:SEC[n],x:x,f:f});x+=SEC[n].w/2}
  function gap(w){props.push({t:'fence',x:x-2,w:w+4});if(w>75){props.push({t:'pole',x:x+(w>>1)});lamps.push({x:x+(w>>1)+9,y:BASE-56})}x+=w}
  sec(1);sec(2);sec(3);gap(90);sec(4);sec(5,1);gap(70);sec(2);sec(3,1);gap(110);sec(4,1);gap(80);sec(3);
  gap(END-110-x);sec(5);sec(2);sec(4);gap(90);sec(3,1);sec(1);gap(80);sec(4,1);sec(2);gap(100);sec(5,1);sec(3)}

/* ================= state & input ================= */
var S={mode:'title',x:START,v:0,last:null,t:0,clock:0,miss:0,bang:0,score:0,cam:0,ready:false};
var C={ph:'',t0:0,p:0,gp:0,k:0,hp:6,mxo:0,wxo:0,jabs:0,flash:0,shake:0,rot:0,voice:0,ping:false,thud:false};
var tug=document.getElementById('tug'),tugFill=document.getElementById('tugfill'),barlab=document.getElementById('barlab'),endText=document.getElementById('endtext');
var D={ph:'',t0:0,white:0,wait:0,p:1,fx:-70,lx:14,bx:0,by:0,bvx:0,bvy:0,brot:0,lane:0,dx:999,dgo:false,tips:0,frot:0,alive:0,td:false,say:'',sayT:0},lvl=document.getElementById('lvl');
function dphase(n){D.ph=n;D.t0=S.clock}
var RUNHINT='THAT THIEF HAS YOUR RING!\nTAP L, R, L, R TO RUN';
function phase(n){C.ph=n;C.t0=S.clock}
function cutting(){return S.mode==='cut'}
var ac=null;
var crowdG,master,sfxG,musG,ambG,droneG,noiseBuf,muted=false,M={next:0,step:0,phrase:0},AMB={car:4,siren:22};
function audio(){try{
  if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
    sfxG=ac.createGain();sfxG.connect(master);musG=ac.createGain();musG.gain.value=.55;musG.connect(master);ambG=ac.createGain();ambG.gain.value=1;ambG.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    /* city bed: low rumble plus a thin layer of air */
    var n1=ac.createBufferSource();n1.buffer=noiseBuf;n1.loop=true;var f1=ac.createBiquadFilter();f1.type='lowpass';f1.frequency.value=190;var g1=ac.createGain();g1.gain.value=.16;n1.connect(f1);f1.connect(g1);g1.connect(ambG);n1.start();
    var n2=ac.createBufferSource();n2.buffer=noiseBuf;n2.loop=true;n2.playbackRate.value=.7;var f2=ac.createBiquadFilter();f2.type='bandpass';f2.frequency.value=1500;f2.Q.value=.4;var g2=ac.createGain();g2.gain.value=.012;n2.connect(f2);f2.connect(g2);g2.connect(ambG);n2.start();
    /* drone under the quiet moments */
    droneG=ac.createGain();droneG.gain.value=0;var df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=260;df.connect(droneG);droneG.connect(musG);
    [55,55.6,82.4].forEach(function(f){var o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(df);o.start()});
    try{var gsrc=ac.createMediaElementSource(gameMus);gmG=ac.createGain();gmG.gain.value=GLEVEL;gsrc.connect(gmG);gmG.connect(master);gameMus.volume=1}catch(e){gmG=null;gameMus.volume=GLEVEL}
    var n3=ac.createBufferSource();n3.buffer=noiseBuf;n3.loop=true;n3.playbackRate.value=.85;var f3=ac.createBiquadFilter();f3.type='bandpass';f3.frequency.value=560;f3.Q.value=.9;crowdG=ac.createGain();crowdG.gain.value=0;n3.connect(f3);f3.connect(crowdG);crowdG.connect(master);n3.start();
    setInterval(tick,40)}
  if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function env(node,t,v,d,dest){var a=ac.createGain();a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(v,t+.006);a.gain.exponentialRampToValueAtTime(.0001,t+d);node.connect(a);a.connect(dest);return a}
function tone(t,f,d,type,v,cut,dest,f2){var o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  var n=o;if(cut){var fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl}env(n,t,v,d,dest||sfxG);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,type,freq,q,dest,rate){var n=ac.createBufferSource();n.buffer=noiseBuf;n.loop=true;n.playbackRate.value=rate||1;var fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=freq;fl.Q.value=q||.7;n.connect(fl);env(fl,t,v,d,dest||sfxG);n.start(t,Math.random());n.stop(t+d+.05);return fl}
function blip(f,d,v){if(!audio())return;try{tone(ac.currentTime,f,d,'square',v||.03,2600)}catch(e){}}
function foot(side){if(!audio())return;try{var t=ac.currentTime,r=.9+Math.random()*.2;noise(t,.07,.16,'bandpass',(side==='L'?1050:1250)*r,1.1);noise(t,.03,.08,'highpass',3500,.7);tone(t,95*r,.09,'sine',.2,0,sfxG,48)}catch(e){}}
function scuff(side){if(!audio())return;try{var t=ac.currentTime,r=.9+Math.random()*.2;noise(t,.2,.12,'bandpass',(side==='L'?520:640)*r,.8,sfxG,.6);tone(t+.02,70*r,.12,'sine',.16,0,sfxG,42)}catch(e){}}
function thump(v,big){if(!audio())return;try{var t=ac.currentTime;noise(t,big?.28:.12,v,'lowpass',big?500:900,.7);tone(t,big?110:150,big?.32:.14,'sine',v*1.4,0,sfxG,38)}catch(e){}}
function stab(){if(!audio())return;try{var t=ac.currentTime;noise(t,.05,.2,'highpass',2800,.7);noise(t+.01,.16,.22,'lowpass',700,.7);tone(t,160,.2,'sine',.3,0,sfxG,40)}catch(e){}}
function engine(){if(!audio())return;try{var t=ac.currentTime;tone(t,46,2,'sawtooth',.2,320,sfxG,150);tone(t,69,2,'square',.07,260,sfxG,225);noise(t,2,.1,'lowpass',420,.7);noise(t+.05,.5,.07,'bandpass',2400,2)}catch(e){}}
/* one siren: two detuned oscillators through a horn-like resonance, sweeping as a slow wail, optionally breaking into a fast yelp */
function wail(t,dur,mult,vol,dest,pan,yelpAt,lp){
  var o1=ac.createOscillator(),o2=ac.createOscillator(),mix=ac.createGain(),horn=ac.createBiquadFilter(),body=ac.createBiquadFilter(),out=ac.createGain(),lo=640*mult,hi=1380*mult,x=t,end=t+dur;
  o1.type='sawtooth';o2.type='square';o2.detune.value=9;mix.gain.value=.5;horn.type='bandpass';horn.frequency.value=1150*mult;horn.Q.value=.9;body.type='lowpass';body.frequency.value=lp||3200;
  [o1,o2].forEach(function(o){o.frequency.setValueAtTime(lo,t)});
  function sweep(a,b,d){[o1,o2].forEach(function(o){o.frequency.setValueAtTime(a,x);o.frequency.exponentialRampToValueAtTime(b,x+d)});x+=d}
  while(x<end){if(yelpAt&&x>=t+yelpAt){sweep(lo*1.05,hi*1.1,.17);sweep(hi*1.1,lo*1.05,.15)}else{sweep(lo,hi,1.7);sweep(hi,lo,2.1)}}
  out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(vol,t+.25);out.gain.setValueAtTime(vol,end-.9);out.gain.exponentialRampToValueAtTime(.0001,end);
  o1.connect(mix);o2.connect(mix);mix.connect(horn);horn.connect(body);body.connect(out);
  var last=out;if(pan&&ac.createStereoPanner){var pn=ac.createStereoPanner();pn.pan.value=pan;out.connect(pn);last=pn}
  last.connect(dest);
  /* slap-back echo off the alley walls */
  var dl=ac.createDelay(.5),fb=ac.createGain(),wet=ac.createGain(),damp=ac.createBiquadFilter();dl.delayTime.value=.21;fb.gain.value=.3;wet.gain.value=.45;damp.type='lowpass';damp.frequency.value=1700;
  last.connect(dl);dl.connect(damp);damp.connect(fb);fb.connect(dl);damp.connect(wet);wet.connect(dest);
  o1.start(t);o2.start(t);o1.stop(end+.1);o2.stop(end+.1)}
function siren(){if(!audio())return;try{var t=ac.currentTime;
  wail(t,7.6,1,.075,sfxG,.35,5.2);wail(t+.9,6.6,.93,.055,sfxG,-.45,0);
  /* two short air-horn blasts as the cars pull up */
  [0,.42].forEach(function(d){tone(t+d,196,.3,'sawtooth',.09,900);tone(t+d,247,.3,'sawtooth',.07,900)})}catch(e){}}
/* ---- ambience events and music, scheduled a little ahead of the clock ---- */
var titleMus=new Audio('title2.mp3'),gameMus=new Audio('game.mp3'),TVOL=.6,GVOL=.32,titleOn=false;
titleMus.loop=true;gameMus.loop=true;titleMus.preload='auto';gameMus.preload='auto';titleMus.volume=TVOL;gameMus.volume=GVOL;
/* some phones ignore element volume, so the level they played at was 1; halve whichever level was actually heard */
var GLEVEL=(Math.abs(gameMus.volume-GVOL)<.02?GVOL:1)*.5,gmG=null;
function playTitle(){if(muted)return;var p=titleMus.play();if(p&&p.then)p.then(function(){titleOn=true;titleHint.textContent='TAP TO START'},function(){titleOn=false;titleHint.textContent='TAP FOR SOUND'});else titleOn=true}
function startGameMusic(){try{titleMus.pause();gameMus.currentTime=0;if(!muted){var p=gameMus.play();if(p&&p.catch)p.catch(function(){})}}catch(e){}}
function mstate(){return null;var m=S.mode,p=C.ph;
