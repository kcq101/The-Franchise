<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Franchise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261006061606">
</head>
<body>
<div class="cab">
  <div class="stage" id="stage">
    <canvas id="c" width="468" height="216"></canvas>
    <div class="hud" id="hud">
      <div id="track"></div>
      <div class="who">
        <img src="assets/img/portrait.png" alt="Frank">
        <div>
          <div class="name">FRANK</div>
          <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sub" id="barlab">SPEED</div>
        </div>
      </div>
      <div class="score"><span class="s">SCORE</span> <b id="score">000000</b><div class="lv" id="lvl">RUSHVILLE<br>LEVEL 1-1</div><button id="snd" type="button">SOUND ON</button></div>
    </div>
    <div id="tug" hidden><span>FRANK</span><div class="t"><i id="tugfill"></i></div><span>THIEF</span></div>
    <div id="hint" hidden></div>
    <div id="end" hidden>
      <p id="endtext"></p>
      <div class="row"><span class="stat" id="stat"></span><span class="btns"><button id="totitle" type="button">LEVELS</button><button id="again" type="button">PLAY AGAIN</button></span></div>
    </div>
    <button id="title" type="button" aria-label="Start game">
      <img class="bg" src="assets/img/title2.webp" alt="">
      <img class="art" src="assets/img/title2.webp" alt="The Franchise">
      <span id="titlehint">TAP TO START</span>
    </button>
    <span id="ver">BUILD 1006-0616</span>
    <label id="lvlpick" for="lvlsel">START AT
      <select id="lvlsel">
        <option value="alley">1. ALLEY RUN</option>
        <option value="scuffle">2. THE SCUFFLE</option>
        <option value="stumble">3. THE STUMBLE</option>
        <option value="fumble">4. THE FUMBLE</option>
        <option value="wake">5. THE WAKE-UP</option>
        <option value="escape">6. THE ESCAPE</option>
        <option value="getaway">7. THE GETAWAY</option>
        <option value="chase">8. THE CHASE</option>
        <option value="stop">9. THE STOP</option>
      </select>
    </label>
  </div>
  <p class="turn">TURN YOUR PHONE SIDEWAYS FOR THE WIDE VIEW</p>
  <div class="pads">
    <button class="pad next" id="padL" type="button"><b>L</b><span>LEFT FOOT</span></button>
    <button class="pad next" id="padR" type="button"><b>R</b><span>RIGHT FOOT</span></button>
  </div>
</div>
<script src="js/core.js?v=20261006061606"></script>
<script src="js/state.js?v=20261006061606"></script>
<script src="js/audio.js?v=20261006061606"></script>
<script src="js/scenery.js?v=20261006061606"></script>
<script src="js/characters.js?v=20261006061606"></script>
<script src="js/input.js?v=20261006061606"></script>
<script src="js/scene-alley.js?v=20261006061606"></script>
<script src="js/scene-dream.js?v=20261006061606"></script>
<script src="js/scene-hospital.js?v=20261006061606"></script>
<script src="js/scene-hallway.js?v=20261006061606"></script>
<script src="js/scene-getaway.js?v=20261006061606"></script>
<script src="js/scene-drive.js?v=20261006061606"></script>
<script src="js/scene-stop.js?v=20261006061606"></script>
<script src="js/render.js?v=20261006061606"></script>
<script src="js/main.js?v=20261006061606"></script>
</body>
</html>
